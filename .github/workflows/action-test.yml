name: 'action-test'

on:
  pull_request:

permissions:
  contents: read

jobs:
  comment-multiline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          id: comment-multiline
          body: |
            ${{ github.event.pull_request.head.sha }} **CI check: inline body with context payload**

            Pull request number is: ${{ github.event.pull_request.number }}

  comment-body-inline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          body: |
            ${{ github.event.pull_request.head.sha }} **CI check: inline body without id**

  comment-template:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          id: comment-template
          template-path: .github/comment.md

  comment-template-bis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    needs: 
      - comment-template
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          id: comment-template
          template-path: .github/comment.md

  comment-template-with-var:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          id: comment-template-with-var
          template-path: .github/comment-with-var.md
          template-var: commit-hash - ${{ github.event.pull_request.head.sha }}

  skip-comment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          id: skip-comment-1
          body: This comment should be skipped!
          skip-comment: not a falsy value

      - id: somestep
        run: echo "value=1" >> "$GITHUB_OUTPUT"

      - uses: $/
        with:
          id: skip-comment-2
          body: This comment should be deleted

      - uses: $/
        with:
          id: skip-comment-2
          body: This comment should be skipped!
          skip-comment: ${{ steps.somestep.outputs.value }}

      - id: someotherstep
        run: echo "value=" >> "$GITHUB_OUTPUT"

      - uses: $/
        with:
          id: skip-comment-3
          body: This comment should not be skipped!
          skip-comment: ${{ steps.someotherstep.outputs.value }}


      - uses: $/
        with:
          id: skip-comment-4
          body: this comment should not be skipped!
          skip-comment: false


  test-main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    needs: 
      - comment-template
      - comment-template-bis
      - comment-body-inline
      - comment-multiline
      - comment-template-with-var
      - skip-comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          npm install
      - run: |
          npm run build
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { assertNoComment, assertOneComment } = await import(`${process.env.GITHUB_WORKSPACE}/lib/find-comment-tests.js`)

            // test by body input 
            await assertOneComment(github, context.payload, /inline body with context payload/)
            await assertOneComment(github, context.payload, /inline body without id/)
            await assertOneComment(github, context.payload, /comment from template[*]/)
            await assertOneComment(github, context.payload, /comment from template with var/)

            await assertOneComment(
              github,
              context.payload,
              new RegExp(`${context.payload.pull_request.head.sha}.*without id`)
            )
            await assertOneComment(
              github,
              context.payload,
              new RegExp(`${context.payload.pull_request.head.sha}.*comment from template[*]`)
            )
            await assertOneComment(
              github,
              context.payload,
              new RegExp(`with var(.|[\r\n]+)*${context.payload.pull_request.head.sha}`)
            )

            // test by comment id 
            await assertOneComment(github, context.payload, /comment-multiline --/)
            await assertOneComment(github, context.payload, /default-id --/)
            await assertOneComment(github, context.payload, /comment-template --/)
            await assertOneComment(github, context.payload, /comment-template-with-var --/)

            // test skip-comment
            await assertOneComment(github, context.payload, /skip-comment-3/)
            await assertOneComment(github, context.payload, /skip-comment-4/)
            await assertNoComment(github, context.payload, /skip-comment-1/)
            await assertNoComment(github, context.payload, /skip-comment-2/)
